<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulpit operatora · Targi Atrakcji</title>
    <!-- connect-src 'none': locally this talks to Electron main over IPC, never the network.
         electron/server.js relaxes exactly this directive on the copy it serves over LAN. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; connect-src 'none'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/pulpit.tsx"></script>
  </body>
</html>
