<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scena · Targi Atrakcji</title>
    <!-- connect-src 'none': the LED wall output provably cannot reach the network locally.
         electron/server.js relaxes exactly this directive on the copy it serves over LAN (the
         "stage runs on a second machine over wifi" case). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; connect-src 'none'" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/scena.tsx"></script>
  </body>
</html>
